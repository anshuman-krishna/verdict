<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Verdict</title>
    <style>
      :root {
        --paper: #e7ece3;
        --paper-raised: #f1f4ec;
        --paper-sunk: #dae1d2;
        --ink: #17251f;
        --ink-soft: #4c5c52;
        --rule: #c0cbb6;
        --accent: #1d5c46;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #111a16;
          --paper-raised: #182420;
          --paper-sunk: #0c1310;
          --ink: #e2e9df;
          --ink-soft: #93a398;
          --rule: #2c3b34;
          --accent: #58b48c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Public Sans", system-ui, sans-serif;
        font-size: 0.9375rem;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule);
      }
      .wordmark {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 600;
      }
      .open-settings {
        text-decoration: none;
        font-size: 1rem;
        line-height: 1;
      }
      .register {
        max-height: 320px;
        overflow-y: auto;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--rule);
      }
      .row:nth-child(even) {
        background: var(--paper-sunk);
      }
      .row .title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .date {
        color: var(--ink-soft);
        font-family: "Fragment Mono", ui-monospace, monospace;
        font-size: 0.8125rem;
      }
      .empty {
        padding: 16px;
        color: var(--ink-soft);
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--rule);
      }
      button {
        font: inherit;
        color: var(--ink);
        background: none;
        border: none;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        padding: 0;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
