<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Verdict</title>
    <style>
      :root {
        --paper: #e7ece3;
        --paper-raised: #f1f4ec;
        --paper-sunk: #dae1d2;
        --ink: #17251f;
        --ink-soft: #4c5c52;
        --rule: #c0cbb6;
        --accent: #1d5c46;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #111a16;
          --paper-raised: #182420;
          --paper-sunk: #0c1310;
          --ink: #e2e9df;
          --ink-soft: #93a398;
          --rule: #2c3b34;
          --accent: #58b48c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Public Sans", system-ui, sans-serif;
        font-size: 0.9375rem;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule);
      }
      .wordmark {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 600;
      }
      .open-settings {
        text-decoration: none;
        font-size: 1rem;
        line-height: 1;
      }
      .register {
        max-height: 320px;
        overflow-y: auto;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--rule);
      }
      .register > div:nth-child(even) .row {
        background: var(--paper-sunk);
      }
      .row .title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .date {
        color: var(--ink-soft);
        font-family: "Fragment Mono", ui-monospace, monospace;
        font-size: 0.8125rem;
      }
      .empty {
        padding: 16px;
        color: var(--ink-soft);
      }
      .search {
        padding: 8px 16px;
        border-bottom: 1px solid var(--rule);
      }
      .search-input {
        width: 100%;
        font: inherit;
        color: var(--ink);
        background: var(--paper-raised);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 4px 8px;
      }
      .search-input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .row {
        width: 100%;
        font: inherit;
        text-align: left;
        text-decoration: none;
      }
      .row:hover {
        background: var(--paper-raised);
      }
      .back {
        font-size: 1rem;
        text-decoration: none;
      }
      .detail {
        padding: 12px 16px;
      }
      .detail-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .detail-title {
        font-weight: 600;
      }
      .detail-band {
        margin: 12px 0 0;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-size: 1.125rem;
      }
      .figures {
        display: flex;
        gap: 24px;
        margin: 8px 0 12px;
      }
      .figures div {
        display: flex;
        flex-direction: column-reverse;
      }
      .figures dd {
        margin: 0;
        font-family: "Fragment Mono", ui-monospace, monospace;
        font-size: 1.5rem;
      }
      .figures dt {
        color: var(--ink-soft);
        font-size: 0.8125rem;
      }
      .strip {
        display: flex;
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        background: var(--paper-sunk);
      }
      .strip .kept {
        background: var(--accent);
      }
      .strip .excluded {
        background: var(--rule);
      }
      .strip-labels {
        display: flex;
        justify-content: space-between;
        margin: 4px 0 12px;
        color: var(--ink-soft);
        font-size: 0.8125rem;
      }
      .interval,
      .unavailable,
      .rescored,
      .checked {
        margin: 0 0 8px;
        color: var(--ink-soft);
        font-size: 0.8125rem;
      }
      .detail h2 {
        margin: 16px 0 4px;
        font-size: 0.8125rem;
        font-weight: 600;
        text-transform: lowercase;
        color: var(--ink-soft);
      }
      .row-toggle {
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 6px 0;
        text-decoration: none;
        border-bottom: 1px solid var(--rule);
      }
      .row-toggle .strength {
        color: var(--ink-soft);
      }
      .detail-text {
        padding: 6px 0;
        color: var(--ink-soft);
        font-size: 0.8125rem;
      }
      .repeat {
        color: var(--ink-soft);
        font-family: "Fragment Mono", ui-monospace, monospace;
        font-size: 0.8125rem;
      }
      .earlier-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid var(--rule);
        color: var(--ink-soft);
        font-size: 0.8125rem;
      }
      .serial {
        margin: 16px 0 0;
        color: var(--ink-soft);
        font-family: "Fragment Mono", ui-monospace, monospace;
        font-size: 0.8125rem;
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--rule);
      }
      .policy-notice {
        border: 1px solid var(--accent);
        border-radius: 2px;
        background: var(--paper-raised);
        padding: 12px 16px;
        margin-bottom: 24px;
      }
      .policy-notice h2 {
        margin: 0;
        font-size: 1rem;
      }
      .policy-notice ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      .policy-notice p {
        margin: 0;
        font-size: 0.875rem;
      }
      .policy-notice .effect {
        color: var(--ink-soft);
      }
      .policy-notice .actions {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 12px;
      }
      .policy-notice a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .provenance {
        margin: 8px 0 0;
        padding-left: 20px;
        color: var(--ink-soft);
        font-size: 0.8125rem;
      }
      .provenance li {
        margin: 2px 0;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: none;
        border: none;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        padding: 0;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
