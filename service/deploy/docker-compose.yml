# caddy is the only path in, see Caddyfile
services:
  verdict-service:
    build:
      context: ..
    restart: unless-stopped
    environment:
      VERDICT_DATABASE_PATH: /data/verdict.db
      VERDICT_BACKUP_DIR: /backups
    volumes:
      - verdict-data:/data
      # separate volume, survives losing the database volume
      - verdict-backups:/backups
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      verdict-service:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  verdict-data:
  verdict-backups:
  caddy-data:
  caddy-config:
