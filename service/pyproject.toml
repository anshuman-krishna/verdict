[project]
name = "verdict-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "leidenalg>=0.12.0",
    "python-igraph>=1.0.0",
    # the asgi server that actually runs the app; fastapi is only the
    # framework. needed for main.py to be runnable at all, not just
    # importable.
    "uvicorn==0.38.0",
]

[dependency-groups]
# httpx is fastapi's TestClient, dev only, never imported by the service itself
dev = ["pytest==9.1.1", "ruff==0.16.6", "httpx==0.28.1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdict_service"]
