[project]
name = "grain-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grain_service"]
