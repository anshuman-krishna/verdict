name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # a quiet week is still worth scanning: new query packs land on their own
    - cron: "0 15 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      # neither language needs a compile step to be analysed
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
