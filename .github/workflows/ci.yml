name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v5
      - name: check python formatting and lint rules
        run: just py lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v5
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      - name: run extension unit tests
        run: just ext test
      - name: run python test suites
        run: just py test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v4
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      - name: build extension for chrome and firefox
        run: just ext build
      - name: install site dependencies
        working-directory: site
        run: npm install
      - name: build site
        working-directory: site
        run: npm run build

  release-manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v4
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      # SPEC.md section 14's 8 MB cap lives in
      # extension/scripts/releaseManifest.mjs, which has tests of its own,
      # rather than being restated as shell here. Building the release
      # manifest is what enforces it, so this job also proves the document
      # SITE.md's /install page promises can actually be produced.
      - name: build the release manifest, enforcing the 8 mb bundle cap
        run: just release
      - name: check the built zips against the manifest just written
        working-directory: extension
        run: node scripts/release-manifest.mjs --verify

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v5
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      - name: compare python and typescript scorers against the shared vectors
        run: just parity

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v4
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      # the harness itself runs in the test job, where it fails on any
      # fixture that broke without a documented reason. This job is
      # SPEC.md section 14's gate: 95 percent across at least four
      # locales. It cannot pass on an empty corpus, and the corpus is
      # hand built (PLAN.md week 1 task 2), so it turns itself on when
      # the first fixture lands rather than needing to be remembered.
      - name: judge the corpus against section 14, once there is one
        run: |
          if ls extension/fixtures/*.html >/dev/null 2>&1; then
            just fixtures
          else
            echo "no fixture corpus yet; the harness itself runs in the test job"
          fi

  # Store removal is this project's main operational risk. This reads
  # the built bundle for the things that cause it: a host the manifest never
  # declared, remote code, a permission nothing justifies, or a grant
  # covering more of the web than any part of this needs.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v4
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      - name: check the built bundle against what gets extensions removed
        run: just preflight

  # service/tests/test_deploy_config.py only parses the Caddyfile text; a
  # docker daemon is what actually resolves docker-compose.yml and builds
  # the image the README's "Deploying the service" section documents, so
  # this is the only place a broken Dockerfile or a compose file that only
  # looks right would be caught before it reaches production.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate docker-compose.yml against the compose spec
        run: docker compose -f service/deploy/docker-compose.yml config --quiet
      - name: build the service image the compose file references
        run: docker compose -f service/deploy/docker-compose.yml build

  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      - name: verify the default analysis path makes no network requests
        working-directory: extension
        run: npx vitest run tests/no-network.spec.ts

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v5
      - name: audit extension javascript dependencies
        working-directory: extension
        run: npm audit --omit=dev --audit-level=high
      - name: audit site javascript dependencies
        working-directory: site
        run: npm audit --omit=dev --audit-level=high
      # the local packages themselves are not on pypi and cannot be looked up,
      # so --no-emit-project keeps this to third party dependencies only
      - name: audit research python dependencies
        working-directory: research
        run: |
          uv export --frozen --no-hashes --no-emit-project -o requirements.txt -q
          uvx pip-audit --strict -r requirements.txt
      - name: audit service python dependencies
        working-directory: service
        run: |
          uv export --frozen --no-hashes --no-emit-project -o requirements.txt -q
          uvx pip-audit --strict -r requirements.txt
