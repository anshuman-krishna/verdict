name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v5
      - name: check python formatting and lint rules
        run: just py lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v5
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      - name: run extension unit tests
        run: just ext test
      - name: run python test suites
        run: just py test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v3
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      - name: build extension for chrome and firefox
        run: just ext build
      - name: install site dependencies
        working-directory: site
        run: npm install
      - name: build site
        working-directory: site
        run: npm run build

  release-manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v3
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      # SPEC.md section 14's 8 MB cap lives in
      # extension/scripts/releaseManifest.mjs, which has tests of its own,
      # rather than being restated as shell here. Building the release
      # manifest is what enforces it, so this job also proves the document
      # SITE.md's /install page promises can actually be produced.
      - name: build the release manifest, enforcing the 8 mb bundle cap
        run: just release
      - name: check the built zips against the manifest just written
        working-directory: extension
        run: node scripts/release-manifest.mjs --verify

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v5
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      - name: compare python and typescript scorers against the shared vectors
        run: just parity

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: once the fixture corpus and extraction harness exist
      # (PLAN.md sessions 2, 5, 6, 7), run the harness here and fail on
      # regression against the hand written expectations.
      - name: run fixture corpus checks
        run: echo "no fixture corpus yet, nothing to check"

  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install extension dependencies
        working-directory: extension
        run: npm install
      - name: verify the default analysis path makes no network requests
        working-directory: extension
        run: npx vitest run tests/no-network.spec.ts
